<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ごほうびポイント</title>
<meta name="description" content="やったことでポイントを貯めて、ごほうびと交換するポイントカード">
<meta name="theme-color" content="#2C7A57">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ごほうびpt">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --fg:#1D2A23; --muted:#5E6E65; --line:#D7DFDA;
  --accent:#2C7A57; --accent-fg:#FFFFFF; --soft:#E1EEE7;
  --gold:#C8901A; --gold-soft:#F7EBCF; --danger:#B4412F;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111713; --surface:#1A221D; --fg:#E4EDE7; --muted:#9AAAA1; --line:#2C3832;
  --accent:#5BBE8F; --accent-fg:#0E1A13; --soft:#1F3328;
  --gold:#E6B64B; --gold-soft:#3A3020; --danger:#E27A66; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.card{background:var(--accent);color:var(--accent-fg);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:14px solid currentColor;opacity:.08}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-label{font-size:12px;letter-spacing:.12em;opacity:.85}
.bal{font-family:var(--f-display);font-weight:900;font-size:56px;line-height:1}
.bal small{font-size:18px;font-weight:700;margin-left:4px}
.next{font-size:13px;opacity:.92}
.stamps{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed currentColor;opacity:.4;max-width:100%}
.stamp.on{border-style:solid;background:var(--accent-fg);opacity:1}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{padding:9px 4px;border-radius:10px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--soft);color:var(--fg)}

section{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-head h2{font-family:var(--f-display);font-size:18px;margin:0}
.link{color:var(--accent);font-weight:700;font-size:13px;padding:4px 2px}
.hint{color:var(--muted);font-size:13px;margin:0}

.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.row .main{flex:1;min-width:0}
.row .name{font-weight:500;overflow-wrap:anywhere}
.row .sub{font-size:12px;color:var(--muted)}
.pill{font-family:var(--f-display);font-weight:900;white-space:nowrap}
.earn-btn{background:var(--soft);color:var(--accent);border-radius:999px;padding:8px 14px;font-family:var(--f-display);font-weight:900;white-space:nowrap;transition:transform .12s}
.earn-btn:active{transform:scale(.94)}
.del{color:var(--danger);font-size:13px;font-weight:700;padding:6px 8px;border-radius:8px}

.reward .bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.reward .bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.buy{border-radius:999px;padding:8px 14px;font-weight:700;white-space:nowrap;background:var(--gold-soft);color:var(--gold)}
.buy[disabled]{opacity:.45;cursor:default}
.buy.confirm{background:var(--gold);color:var(--bg)}
.cancel{font-size:13px;color:var(--muted);padding:6px}

form.add{display:flex;flex-wrap:wrap;gap:8px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px}
form.add input{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
form.add .n{flex:1 1 160px}
form.add .p{flex:0 0 90px}
.primary{background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:9px 16px;font-weight:700}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700}

.plus{color:var(--accent)} .minus{color:var(--gold)}
.day{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-top:6px}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:18px;border:1px dashed var(--line);border-radius:14px}

details.backup{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
details.backup summary{font-weight:700;cursor:pointer}
details.backup .inner{display:flex;flex-direction:column;gap:10px;margin-top:10px}
details.backup textarea{font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:90px;width:100%;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" aria-live="polite">
    <div class="card-top"><span class="card-label">いまのポイント</span><span class="card-label" id="earnedToday"></span></div>
    <div class="bal num" id="bal">0<small>pt</small></div>
    <div class="stamps" id="stamps" aria-hidden="true"></div>
    <div class="next" id="next"></div>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-v="earn">ためる</button>
    <button role="tab" aria-selected="false" data-v="use">つかう</button>
    <button role="tab" aria-selected="false" data-v="log">りれき</button>
  </div>

  <section id="v-earn">
    <div class="sec-head"><h2>やったことを記録</h2><button class="link" id="edit-earn">編集</button></div>
    <p class="hint">タップするとポイントが入ります。</p>
    <div class="list" id="tasks"></div>
    <form class="add" id="add-task" hidden>
      <input class="n" id="task-name" placeholder="例: 筋トレした" maxlength="40" required>
      <input class="p num" id="task-pts" type="number" inputmode="numeric" min="1" max="9999" placeholder="pt" required>
      <button class="primary" type="submit">追加</button>
    </form>
    <form class="add" id="add-oneoff">
      <input class="n" id="one-name" placeholder="その他（内容）" maxlength="40" required>
      <input class="p num" id="one-pts" type="number" inputmode="numeric" min="1" max="9999" placeholder="pt" required>
      <button class="primary" type="submit">+ 記録</button>
    </form>
  </section>

  <section id="v-use" hidden>
    <div class="sec-head"><h2>ごほうびと交換</h2><button class="link" id="edit-use">編集</button></div>
    <div class="list" id="rewards"></div>
    <form class="add" id="add-reward" hidden>
      <input class="n" id="rw-name" placeholder="例: 欲しかった本" maxlength="40" required>
      <input class="p num" id="rw-pts" type="number" inputmode="numeric" min="1" max="99999" placeholder="pt" required>
      <button class="primary" type="submit">追加</button>
    </form>
  </section>

  <section id="v-log" hidden>
    <div class="sec-head"><h2>りれき</h2></div>
    <p class="hint">間違えた記録は「取消」で消せます。</p>
    <div class="list" id="log"></div>
    <details class="backup">
      <summary>バックアップ・機種変更</summary>
      <div class="inner">
        <p class="hint">データはこの端末の中だけに保存されています。別の端末へ移すときは、ここでコードをコピーして、移し先の同じ欄に貼り付けて「復元」を押してください。</p>
        <div class="btns"><button class="ghost" id="bk-copy" type="button">コードをコピー</button></div>
        <textarea id="bk-text" placeholder="ここにバックアップコードを貼り付け"></textarea>
        <div class="btns"><button class="ghost" id="bk-restore" type="button">復元</button><button class="primary" id="bk-restore-ok" type="button" hidden>上書きして復元する</button></div>
      </div>
    </details>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const KEY = 'gohoubi-point-v1';
  const $ = id => document.getElementById(id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const seed = () => ({
    tasks: [
      { id: 'ex1', name: '（例）筋トレした', pts: 10, at: 1 },
      { id: 'ex2', name: '（例）勉強を1時間', pts: 15, at: 2 },
      { id: 'ex3', name: '（例）早く寝た', pts: 5, at: 3 }],
    rewards: [
      { id: 'ex1', name: '（例）コンビニスイーツ', cost: 50, at: 1 },
      { id: 'ex2', name: '（例）欲しかった本', cost: 200, at: 2 }],
    log: []
  });
  const clean = d => ({
    tasks: (Array.isArray(d.tasks) ? d.tasks : []).map(x => ({ id: String(x.id || uid()), name: String(x.name || '').slice(0, 40), pts: Math.max(1, x.pts | 0), at: +x.at || 0 })),
    rewards: (Array.isArray(d.rewards) ? d.rewards : []).map(x => ({ id: String(x.id || uid()), name: String(x.name || '').slice(0, 40), cost: Math.max(1, x.cost | 0), at: +x.at || 0 })),
    log: (Array.isArray(d.log) ? d.log : []).map(x => ({ id: String(x.id || uid()), type: x.type === 'spend' ? 'spend' : 'earn', name: String(x.name || '').slice(0, 40), pts: Math.max(0, x.pts | 0), at: +x.at || 0 }))
  });

  let data;
  try { const raw = localStorage.getItem(KEY); data = raw ? clean(JSON.parse(raw)) : seed(); } catch (e) { data = seed(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { toast('保存できませんでした（ストレージが使えません）'); } };
  save();
  // ask the browser not to evict data
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

  const UI = { editEarn: false, editUse: false, confirmBuy: null, confirmDel: null };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const balance = () => data.log.reduce((a, l) => a + (l.type === 'spend' ? -l.pts : l.pts), 0);
  let toastT;
  const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); };

  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
    ['earn','use','log'].forEach(v => $('v-' + v).hidden = v !== b.dataset.v);
  }));

  function renderCard() {
    const bal = balance();
    $('bal').innerHTML = bal.toLocaleString() + '<small>pt</small>';
    const today = new Date().toDateString();
    const t = data.log.filter(l => l.type === 'earn' && new Date(l.at).toDateString() === today).reduce((a, l) => a + l.pts, 0);
    $('earnedToday').textContent = t ? '今日 +' + t + 'pt' : '';
    const goal = data.rewards.filter(r => r.cost > bal).sort((a, b) => a.cost - b.cost)[0];
    let ratio = 0;
    if (goal) { ratio = bal / goal.cost; $('next').textContent = '「' + goal.name + '」まで あと ' + (goal.cost - bal).toLocaleString() + 'pt'; }
    else if (data.rewards.length) { ratio = 1; $('next').textContent = '登録したごほうびは全部交換できます'; }
    else $('next').textContent = 'ごほうびを登録すると、あと何ptか表示されます';
    const on = Math.max(0, Math.min(10, Math.floor(ratio * 10)));
    $('stamps').innerHTML = Array.from({length: 10}, (_, i) => '<span class="stamp' + (i < on ? ' on' : '') + '"></span>').join('');
  }

  function renderTasks() {
    const el = $('tasks');
    if (!data.tasks.length) { el.innerHTML = '<div class="empty">「編集」から、ポイントがもらえる行動を登録しましょう</div>'; return; }
    el.innerHTML = data.tasks.map(t => '<div class="row"><div class="main"><div class="name">' + esc(t.name) + '</div>' +
      (UI.editEarn ? '<div class="sub num">' + t.pts + 'pt</div>' : '') + '</div>' +
      (UI.editEarn ? '<button class="del" data-del-task="' + esc(t.id) + '">削除</button>'
                   : '<button class="earn-btn num" data-earn="' + esc(t.id) + '">+' + t.pts + 'pt</button>') + '</div>').join('');
  }

  function renderRewards() {
    const el = $('rewards'), bal = balance();
    if (!data.rewards.length) { el.innerHTML = '<div class="empty">「編集」から、欲しいものと必要ポイントを登録しましょう</div>'; return; }
    el.innerHTML = [...data.rewards].sort((a, b) => a.cost - b.cost).map(r => {
      const pct = Math.min(100, Math.max(0, bal / r.cost * 100));
      let act;
      if (UI.editUse) act = '<button class="del" data-del-rw="' + esc(r.id) + '">削除</button>';
      else if (UI.confirmBuy === r.id) act = '<button class="cancel" data-cancel>やめる</button><button class="buy confirm" data-buy-ok="' + esc(r.id) + '">交換する</button>';
      else act = '<button class="buy" data-buy="' + esc(r.id) + '"' + (bal < r.cost ? ' disabled' : '') + '>交換</button>';
      return '<div class="row reward"><div class="main"><div class="name">' + esc(r.name) + '</div>' +
        '<div class="sub num">' + r.cost.toLocaleString() + 'pt' + (bal < r.cost ? '・あと ' + (r.cost - bal).toLocaleString() + 'pt' : '') + '</div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div></div>' + act + '</div>';
    }).join('');
  }

  function renderLog() {
    const el = $('log');
    if (!data.log.length) { el.innerHTML = '<div class="empty">まだ記録はありません</div>'; return; }
    let lastDay = '', html = '';
    [...data.log].sort((a, b) => b.at - a.at).slice(0, 300).forEach(l => {
      const d = new Date(l.at), day = (d.getMonth() + 1) + '/' + d.getDate() + '（' + '日月火水木金土'[d.getDay()] + '）';
      if (day !== lastDay) { html += '<div class="day">' + day + '</div>'; lastDay = day; }
      const tm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      const sp = l.type === 'spend';
      html += '<div class="row"><div class="main"><div class="name">' + esc(l.name) + '</div><div class="sub num">' + tm + (sp ? '・交換' : '') + '</div></div>' +
        '<span class="pill num ' + (sp ? 'minus' : 'plus') + '">' + (sp ? '−' : '+') + l.pts + '</span>' +
        (UI.confirmDel === l.id ? '<button class="del" data-del-log-ok="' + esc(l.id) + '">消す</button><button class="cancel" data-cancel>戻す</button>'
                                : '<button class="cancel" data-del-log="' + esc(l.id) + '">取消</button>') + '</div>';
    });
    el.innerHTML = html;
  }

  function render() {
    renderCard(); renderTasks(); renderRewards(); renderLog();
    $('edit-earn').textContent = UI.editEarn ? '完了' : '編集'; $('add-task').hidden = !UI.editEarn;
    $('edit-use').textContent = UI.editUse ? '完了' : '編集'; $('add-reward').hidden = !UI.editUse;
  }
  const commit = () => { save(); render(); };

  $('edit-earn').onclick = () => { UI.editEarn = !UI.editEarn; render(); };
  $('edit-use').onclick = () => { UI.editUse = !UI.editUse; UI.confirmBuy = null; render(); };

  const addLog = (type, name, pts) => data.log.push({ id: uid(), type, name, pts, at: Date.now() });

  document.addEventListener('click', e => {
    const b = e.target.closest('button[data-earn],button[data-buy],button[data-buy-ok],button[data-cancel],button[data-del-log],button[data-del-log-ok],button[data-del-task],button[data-del-rw]');
    if (!b) return;
    const d = b.dataset;
    if (d.earn) { const t = data.tasks.find(x => x.id === d.earn); if (!t) return; addLog('earn', t.name, t.pts); commit(); toast('+' + t.pts + 'pt'); }
    else if (d.buy) { UI.confirmBuy = d.buy; render(); }
    else if (d.buyOk) { const r = data.rewards.find(x => x.id === d.buyOk); UI.confirmBuy = null;
      if (!r || balance() < r.cost) { toast('ポイントが足りません'); render(); return; }
      addLog('spend', r.name, r.cost); commit(); toast('「' + r.name + '」と交換しました'); }
    else if (d.cancel !== undefined) { UI.confirmBuy = null; UI.confirmDel = null; render(); }
    else if (d.delLog) { UI.confirmDel = d.delLog; render(); }
    else if (d.delLogOk) { UI.confirmDel = null; data.log = data.log.filter(x => x.id !== d.delLogOk); commit(); toast('取り消しました'); }
    else if (d.delTask) { data.tasks = data.tasks.filter(x => x.id !== d.delTask); commit(); }
    else if (d.delRw) { data.rewards = data.rewards.filter(x => x.id !== d.delRw); commit(); }
  });

  const onAdd = (formId, nameId, ptsId, fn) => $(formId).addEventListener('submit', e => {
    e.preventDefault();
    const name = $(nameId).value.trim(), pts = parseInt($(ptsId).value, 10);
    if (!name || !(pts > 0)) return;
    fn(name, pts); commit(); $(nameId).value = ''; $(ptsId).value = '';
  });
  onAdd('add-task', 'task-name', 'task-pts', (name, pts) => data.tasks.push({ id: uid(), name, pts, at: Date.now() }));
  onAdd('add-reward', 'rw-name', 'rw-pts', (name, cost) => data.rewards.push({ id: uid(), name, cost, at: Date.now() }));
  onAdd('add-oneoff', 'one-name', 'one-pts', (name, pts) => { addLog('earn', name, pts); toast('+' + pts + 'pt'); });

  // backup
  const encode = () => btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  $('bk-copy').onclick = async () => {
    const code = encode(); $('bk-text').value = code;
    try { await navigator.clipboard.writeText(code); toast('コピーしました'); }
    catch (e) { $('bk-text').select(); toast('選択したのでコピーしてください'); }
  };
  let pending = null;
  $('bk-restore').onclick = () => {
    try {
      const d = JSON.parse(decodeURIComponent(escape(atob($('bk-text').value.trim()))));
      pending = clean(d);
      $('bk-restore-ok').hidden = false;
      toast('記録 ' + pending.log.length + '件のデータです。確認ボタンで上書きします');
    } catch (e) { pending = null; $('bk-restore-ok').hidden = true; toast('コードが読めませんでした。全部コピーできているか確認してください'); }
  };
  $('bk-restore-ok').onclick = () => {
    if (!pending) return;
    data = pending; pending = null; $('bk-restore-ok').hidden = true; $('bk-text').value = '';
    commit(); toast('復元しました');
  };

  render();

  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
</html>
